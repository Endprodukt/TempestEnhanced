; Tempest Enhanced: the settings that come with the program.
; Your own go into save/tempest.ini (same keys); what stands there wins.
; The service menu (F2, or start 1 and fire held two seconds) writes them.

; A folder or zip with the ROMs (MAME's tempest.zip). Empty: the usual
; places (--roms, $TP_ROMS, ./roms, the folders of advmame.rc).
rom_path =

; The picture: vertical (native, an upright monitor as on the cabinet) or
; horizontal (laid out for a horizontal 4:3 screen)
orientation = horizontal
; pictures between the game's frames
smooth = 1
; the game's frames on a fixed beat, the cabinet's average (0: as the cabinet)
steady_frames = 1
; 1.0: as large as the screen allows; position in board units
size_x = 1.000
size_y = 1.000
pos_x = 0
pos_y = 0
flip_x = 0
flip_y = 0
brightness = 1.00
gamma = 0.80
; pictures a second sent to the vector board, which shows each until the
; next comes (40..60, the service menu's BOARD RATE). The more, the steadier
; the picture, but the board has to draw one in time: a game's picture with
; all enhancements takes up to about 155000 units of beam, about 18 ms, so
; 50 (Tempest 2000's port sends 40).
board_hz = 50

; The cabinet's option switches, as MAME's ports have them (hex): N13
; coinage, L12 minimum, language, bonus life, lives. 00 00: 1 coin 1 play,
; English, bonus at 20000, 3 lives.
dsw1 = 00
dsw2 = 00
; MAME: 2 easy, 3 medium 1, 0 medium 2, 1 hard
difficulty = 3
; 1: start levels 1 3 5 7 9; 0: tied to the high score
rating = 1
cocktail = 0

; The spinner: its sensitivity (the service menu sets it, with a test on
; level 1), reversed; turning with keys or a stick, segments a second
spin_sens = 6.00
spin_reverse = 0
key_speed = 8.0

; What each action is bound to: auto (advmame.rc, or the PC's keys), none,
; key NAME, joyN button K, joyN axis K +/-, joyN hat K up/down/left/right,
; mouse x, mouse y
bind_spinner = auto
bind_spin_left = auto
bind_spin_right = auto
bind_fire = auto
bind_zap = auto
bind_start1 = auto
bind_start2 = auto
bind_coin1 = auto
bind_coin2 = auto
bind_menu = auto
menu_hold = 1
volume = 1.00

; The enhancements (the service menu's ENHANCEMENTS page), 1 on, 0 off:
; the claw's lane lit, a warp starfield in the flight to the next level,
; the tube flashing with the superzapper, trails behind shots, sparks from
; explosions, the claw and enemies hit breaking apart, the old tube's near
; rim left out in the flight once passed, twinkling stars
; beside the tube, the high score's fireworks over the width, ENHANCED
; under the title, SUPERZAPPER RECHARGE large in the middle, the title in
; the marquee's lettering
fx_lane = 1
fx_warp = 1
fx_zap = 1
fx_trails = 1
fx_sparks = 1
fx_claw = 1
fx_shatter = 1
fx_rim = 1
fx_stars = 1
fx_fireworks = 1
fx_title = 1
fx_recharge = 1
fx_logo = 1
